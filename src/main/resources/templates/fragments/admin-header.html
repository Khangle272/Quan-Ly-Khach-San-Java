<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="adminHeader" class="navbar navbar-expand-lg admin-header">
    <div class="container-fluid">
        <a class="navbar-brand admin-brand" th:href="@{/admin/dashboard}">
            <span class="admin-brand-mark">
                <i class="bi bi-speedometer2"></i>
            </span>
            <span class="admin-brand-text">Hotel Admin</span>
        </a>

        <button class="navbar-toggler admin-navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#adminNavbar"
                aria-controls="adminNavbar"
                aria-expanded="false"
                aria-label="Mở menu quản trị">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="adminNavbar">
            <ul class="navbar-nav admin-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/dashboard}">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/rooms}">
                        Quản lý phòng
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/categories}">
                        Quản lý loại phòng
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/bookings}">
                        Quản lý đặt phòng
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/users}">
                        Quản lý người dùng
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/reviews}">
                        Quản lý đánh giá
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/coupons}">
                        Quản lý mã giảm giá
                    </a>
                </li>
            </ul>

            <div class="admin-header-actions">
                <a class="admin-view-site-link" th:href="@{/}">
                    Xem website
                </a>

                <div class="admin-user-chip" sec:authorize="isAuthenticated()">
                    <i class="bi bi-person-gear"></i>
                    <span>
                        Admin:
                        <strong sec:authentication="name">admin</strong>
                    </span>
                </div>

                <form th:action="@{/logout}" method="post" class="logout-form m-0">
                    <button type="submit" class="admin-logout-button">
                        Đăng xuất
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

</body>
</html>
