<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hotel Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">
<div th:replace="~{fragments/header :: header}"></div>

<main class="flex-grow-1">
    <section class="home-hero">
        <div class="container">
            <div class="row align-items-center g-4">
                <div class="col-lg-6">
                    <span class="hero-kicker">Hotel Booking</span>
                    <h1 class="hero-title">Tìm phòng phù hợp cho kỳ nghỉ của bạn</h1>
                    <p class="hero-text">
                        Chọn loại phòng và ngày lưu trú để xem các phòng còn trống theo lịch của khách sạn.
                    </p>
                </div>

                <div class="col-lg-6">
                    <div class="booking-search-card">
                        <h2 class="h4 fw-bold mb-3">Đặt phòng ngay</h2>
                        <form th:action="@{/rooms}" method="get">
                            <div class="mb-3">
                                <label for="categoryId" class="form-label">Loại phòng</label>
                                <select id="categoryId" name="categoryId" class="form-select" required>
                                    <option value="">Chọn loại phòng</option>
                                    <option th:each="category : ${categories}"
                                            th:value="${category.id}"
                                            th:text="${category.name}">
                                        Standard
                                    </option>
                                </select>
                            </div>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="checkIn" class="form-label">Ngày nhận phòng</label>
                                    <input id="checkIn" name="checkIn" type="date" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="checkOut" class="form-label">Ngày trả phòng</label>
                                    <input id="checkOut" name="checkOut" type="date" class="form-control" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mt-4">
                                <i class="bi bi-calendar-check me-1"></i>
                                Đặt phòng ngay
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
