<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - Hotel Booking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <div th:replace="~{fragments/toast :: toastScripts}"></div>
</head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="flex-grow-1 auth-page">
    <div class="container">
        <div class="auth-shell">
            <section class="auth-card">
                <div class="auth-head">
                    <a class="auth-brand" th:href="@{/}">
                        <span class="app-brand-mark">
                            <i class="bi bi-building"></i>
                        </span>
                        <span>Hotel Booking</span>
                    </a>
                    <h1>Quên mật khẩu</h1>
                    <p>Nhập email hoặc tên đăng nhập để chuyển sang đặt lại mật khẩu.</p>
                </div>

                <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>
                <div class="alert alert-info" th:if="${infoMessage}" th:text="${infoMessage}"></div>
                <div class="alert alert-success" th:if="${resetUsername}">
                    <div>Đặt lại bằng tên đăng nhập:</div>
                    <a th:href="@{/reset-password(username=${resetUsername})}" th:text="${resetUsername}"></a>
                </div>

                <form th:action="@{/forgot-password}" method="post" class="auth-form">
                    <div class="auth-field">
                        <label for="identifier">Email hoặc tên đăng nhập</label>
                        <div class="auth-input-wrap">
                            <i class="bi bi-envelope"></i>
                            <input id="identifier"
                                   name="identifier"
                                   type="text"
                                   class="auth-control"
                                   placeholder="Nhập email hoặc tên đăng nhập"
                                   autocomplete="username"
                                   required>
                        </div>
                    </div>

                    <button type="submit" class="auth-submit">Tiếp tục đặt lại</button>
                </form>

                <div class="auth-switch">
                    <a th:href="@{/login}">Quay lại đăng nhập</a>
                </div>
            </section>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/toast.js}"></script>
</body>
</html>
