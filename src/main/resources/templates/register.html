<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Hotel Booking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <div th:replace="~{fragments/toast :: toastScripts}"></div>
</head>

<body class="d-flex flex-column min-vh-100"
      th:attr="data-success-message=${successMessage},
               data-error-message=${errorMessage}">
<div th:replace="~{fragments/header :: header}"></div>

<main class="flex-grow-1 auth-page">
    <div class="container">
        <div class="auth-shell">

            <section class="auth-card auth-card-wide">
                <div class="auth-head">
                    <a class="auth-brand" th:href="@{/}">
                        <span class="app-brand-mark">
                            <i class="bi bi-building"></i>
                        </span>
                        <span>Hotel Booking</span>
                    </a>

                    <h1>Tạo tài khoản</h1>

                    <p>
                        Đăng ký tài khoản để đặt phòng nhanh hơn và theo dõi lịch sử lưu trú.
                    </p>
                </div>

                <div class="auth-alert auth-alert-danger"
                     th:if="${errorMessage != null}">
                    <i class="bi bi-exclamation-circle"></i>
                    <span th:text="${errorMessage}">
                        Có lỗi xảy ra. Vui lòng thử lại.
                    </span>
                </div>

                <form th:action="@{/register}" method="post" class="auth-form">
                    <div class="auth-grid">
                        <div class="auth-field">
                            <label for="fullName">Họ tên <span>*</span></label>
                            <div class="auth-input-wrap">
                                <i class="bi bi-person"></i>
                                <input id="fullName"
                                       name="fullName"
                                       type="text"
                                       class="auth-control"
                                       placeholder="Nhập họ tên"
                                       th:value="${fullName}"
                                       autocomplete="name"
                                       required>
                            </div>
                        </div>

                        <div class="auth-field">
                            <label for="username">Tên đăng nhập <span>*</span></label>
                            <div class="auth-input-wrap">
                                <i class="bi bi-at"></i>
                                <input id="username"
                                       name="username"
                                       type="text"
                                       class="auth-control"
                                       placeholder="Nhập tên đăng nhập"
                                       th:value="${username}"
                                       autocomplete="username"
                                       required>
                            </div>
                        </div>

                        <div class="auth-field">
                            <label for="email">Email</label>
                            <div class="auth-input-wrap">
                                <i class="bi bi-envelope"></i>
                                <input id="email"
                                       name="email"
                                       type="email"
                                       class="auth-control"
                                       placeholder="Nhập email"
                                       th:value="${email}"
                                       autocomplete="email"
                                       pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$">
                            </div>
                        </div>

                        <div class="auth-field">
                            <label for="phone">Số điện thoại</label>
                            <div class="auth-input-wrap">
                                <i class="bi bi-telephone"></i>
                                <input id="phone"
                                       name="phone"
                                       type="tel"
                                       class="auth-control"
                                       placeholder="Nhập số điện thoại"
                                       th:value="${phone}"
                                       autocomplete="tel"
                                       pattern="^\+?[0-9]{10,15}$">
                            </div>
                        </div>

                        <div class="auth-field">
                            <label for="password">Mật khẩu <span>*</span></label>
                            <div class="auth-input-wrap">
                                <i class="bi bi-lock"></i>
                                <input id="password"
                                       name="password"
                                       type="password"
                                       class="auth-control"
                                       placeholder="Nhập mật khẩu"
                                       autocomplete="new-password"
                                       minlength="6"
                                       required>
                            </div>
                        </div>

                        <div class="auth-field">
                            <label for="confirmPassword">Xác nhận mật khẩu <span>*</span></label>
                            <div class="auth-input-wrap">
                                <i class="bi bi-shield-lock"></i>
                                <input id="confirmPassword"
                                       name="confirmPassword"
                                       type="password"
                                       class="auth-control"
                                       placeholder="Nhập lại mật khẩu"
                                       autocomplete="new-password"
                                       minlength="6"
                                       required>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="auth-submit">
                        Tạo tài khoản
                    </button>
                </form>

                <div class="auth-switch">
                    <span>Đã có tài khoản?</span>
                    <a th:href="@{/login}">Đăng nhập</a>
                </div>
            </section>

        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/toast.js}"></script>
</body>
</html>
