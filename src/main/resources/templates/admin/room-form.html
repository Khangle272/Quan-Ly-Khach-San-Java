<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Admin'">Form phòng - Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <div th:replace="~{fragments/toast :: toastScripts}"></div>
</head>

<body class="d-flex flex-column min-vh-100"
      th:attr="data-success-message=${successMessage},
               data-error-message=${errorMessage}">
<div th:replace="~{fragments/admin-header :: adminHeader}"></div>

<main class="flex-grow-1 admin-crud-page">
    <div class="container">

        <div class="admin-crud-nav">
            <a th:href="@{/admin/rooms}" class="admin-crud-back">
                <i class="bi bi-arrow-left"></i>
                <span>Quay lại danh sách phòng</span>
            </a>
        </div>

        <section class="admin-crud-head">
            <div>
                <span>Quản lý phòng</span>
                <h1 th:text="${pageTitle}">Thêm phòng</h1>
                <p>
                    Cập nhật số phòng, tầng, trạng thái và loại phòng tương ứng.
                </p>
            </div>
        </section>

        <section class="admin-form-card">
            <form th:action="@{/admin/rooms/save}" method="post" class="admin-form">
                <input type="hidden" name="id" th:value="${room.id}">

                <div class="admin-form-grid">
                    <div class="admin-form-field">
                        <label for="roomNumber">Số phòng <span>*</span></label>
                        <div class="admin-form-control-wrap">
                            <i class="bi bi-door-open"></i>
                            <input id="roomNumber"
                                   name="roomNumber"
                                   type="text"
                                   class="admin-form-control"
                                   placeholder="Ví dụ: 101"
                                   th:value="${room.roomNumber}"
                                   required>
                        </div>
                    </div>

                    <div class="admin-form-field">
                        <label for="floor">Tầng <span>*</span></label>
                        <div class="admin-form-control-wrap">
                            <i class="bi bi-layers"></i>
                            <input id="floor"
                                   name="floor"
                                   type="number"
                                   min="1"
                                   class="admin-form-control"
                                   placeholder="Ví dụ: 1"
                                   th:value="${room.floor}"
                                   required>
                        </div>
                    </div>

                    <div class="admin-form-field">
                        <label for="status">Trạng thái <span>*</span></label>
                        <div class="admin-form-control-wrap">
                            <i class="bi bi-info-circle"></i>
                            <select id="status"
                                    name="status"
                                    class="admin-form-control"
                                    required>
                                <option value="AVAILABLE"
                                        th:selected="${room.status == null or room.status == 'AVAILABLE'}">
                                    Còn phòng
                                </option>
                                <option value="OCCUPIED"
                                        th:selected="${room.status == 'OCCUPIED'}">
                                    Đã đặt
                                </option>
                                <option value="MAINTENANCE"
                                        th:selected="${room.status == 'MAINTENANCE'}">
                                    Bảo trì
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="admin-form-field">
                        <label for="categoryId">Loại phòng <span>*</span></label>
                        <div class="admin-form-control-wrap">
                            <i class="bi bi-grid"></i>
                            <select id="categoryId"
                                    name="categoryId"
                                    class="admin-form-control"
                                    required>
                                <option value="">Chọn loại phòng</option>

                                <option th:each="category : ${categories}"
                                        th:value="${category.id}"
                                        th:selected="${room.category != null and room.category.id == category.id}"
                                        th:text="${category.name}">
                                    Standard
                                </option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="admin-form-actions">
                    <a th:href="@{/admin/rooms}" class="admin-form-secondary">
                        Hủy
                    </a>

                    <button type="submit" class="admin-form-submit">
                        <i class="bi bi-check2"></i>
                        <span th:text="${submitText}">Lưu</span>
                    </button>
                </div>
            </form>
        </section>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/toast.js}"></script>
</body>
</html>
