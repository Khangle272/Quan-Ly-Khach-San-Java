<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Admin'">Form loại phòng - Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <div th:replace="~{fragments/toast :: toastScripts}"></div>
</head>

<body class="d-flex flex-column min-vh-100"
      th:attr="data-success-message=${successMessage},
               data-error-message=${errorMessage}">
<div th:replace="~{fragments/admin-header :: adminHeader}"></div>

<main class="flex-grow-1 admin-crud-page">
    <div class="container">

        <div class="admin-crud-nav">
            <a th:href="@{/admin/categories}" class="admin-crud-back">
                <i class="bi bi-arrow-left"></i>
                <span>Quay lại danh sách loại phòng</span>
            </a>
        </div>

        <section class="admin-crud-head">
            <div>
                <span>Quản lý loại phòng</span>
                <h1 th:text="${pageTitle}">Thêm loại phòng</h1>
                <p>
                    Cập nhật tên loại phòng, giá, sức chứa, loại giường và tiện nghi.
                </p>
            </div>
        </section>

        <section class="admin-form-card">
            <form th:action="@{/admin/categories/save}" method="post" class="admin-form" enctype="multipart/form-data">
                <input type="hidden" name="id" th:value="${category.id}">

                <div class="admin-form-grid">
                    <div class="admin-form-field">
                        <label for="name">Tên loại phòng <span>*</span></label>
                        <div class="admin-form-control-wrap">
                            <i class="bi bi-grid"></i>
                            <input id="name"
                                   name="name"
                                   type="text"
                                   class="admin-form-control"
                                   placeholder="Ví dụ: Deluxe"
                                   th:value="${category.name}"
                                   required>
                        </div>
                    </div>

                    <div class="admin-form-field">
                        <label for="price">Giá mỗi đêm <span>*</span></label>
                        <div class="admin-form-control-wrap">
                            <i class="bi bi-cash-stack"></i>
                            <input id="price"
                                   name="price"
                                   type="number"
                                   min="0"
                                   step="1000"
                                   class="admin-form-control"
                                   placeholder="Ví dụ: 850000"
                                   th:value="${category.price}"
                                   required>
                        </div>
                    </div>

                    <div class="admin-form-field">
                        <label for="capacity">Sức chứa <span>*</span></label>
                        <div class="admin-form-control-wrap">
                            <i class="bi bi-people"></i>
                            <input id="capacity"
                                   name="capacity"
                                   type="number"
                                   min="1"
                                   class="admin-form-control"
                                   placeholder="Ví dụ: 2"
                                   th:value="${category.capacity}"
                                   required>
                        </div>
                    </div>

                    <div class="admin-form-field">
                        <label for="bedType">Loại giường <span>*</span></label>
                        <div class="admin-form-control-wrap">
                            <i class="bi bi-lamp"></i>
                            <input id="bedType"
                                   name="bedType"
                                   type="text"
                                   class="admin-form-control"
                                   placeholder="Ví dụ: Giường đôi"
                                   th:value="${category.bedType}"
                                   required>
                        </div>
                    </div>
                </div>

                <div class="admin-form-field">
                    <label for="amenities">Tiện nghi</label>
                    <div class="admin-form-control-wrap">
                        <i class="bi bi-stars"></i>
                        <input id="amenities"
                               name="amenities"
                               type="text"
                               class="admin-form-control"
                               placeholder="Ví dụ: WiFi, Điều hòa, TV, Phòng tắm riêng"
                               th:value="${category.amenities}">
                    </div>

                    <p class="admin-form-help">
                        Nhập các tiện nghi cách nhau bằng dấu phẩy.
                    </p>
                </div>

                <div class="admin-form-field">
                    <label for="imageFile">Ảnh phòng</label>
                    <div class="admin-form-control-wrap">
                        <i class="bi bi-image"></i>
                        <input id="imageFile"
                               name="imageFiles"
                               type="file"
                               class="admin-form-control"
                               accept="image/*"
                               multiple>
                    </div>

                    <p class="admin-form-help">
                        Có thể chọn nhiều ảnh cùng lúc.
                    </p>

                    <p class="admin-form-help"
                       th:if="${category.imagePaths != null and !#strings.isEmpty(category.imagePaths)}"
                       th:with="images=${#strings.arraySplit(category.imagePaths, ',')}">
                        <span th:text="'Đã lưu ' + ${#arrays.length(images)} + ' ảnh.'">Đã lưu 0 ảnh.</span>
                    </p>
                </div>

                <div class="admin-form-field">
                    <label for="description">Mô tả</label>
                    <div class="admin-form-textarea-wrap">
                        <textarea id="description"
                                  name="description"
                                  class="admin-form-textarea"
                                  rows="5"
                                  placeholder="Mô tả ngắn về loại phòng..."
                                  th:text="${category.description}"></textarea>
                    </div>
                </div>

                <div class="admin-form-actions">
                    <a th:href="@{/admin/categories}" class="admin-form-secondary">
                        Hủy
                    </a>

                    <button type="submit" class="admin-form-submit">
                        <i class="bi bi-check2"></i>
                        <span th:text="${submitText}">Lưu</span>
                    </button>
                </div>
            </form>
        </section>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/toast.js}"></script>
</body>
</html>
