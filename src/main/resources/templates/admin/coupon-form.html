<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Admin'">Form mã giảm giá - Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <div th:replace="~{fragments/toast :: toastScripts}"></div>
</head>

<body class="d-flex flex-column min-vh-100"
      th:attr="data-success-message=${successMessage},
               data-error-message=${errorMessage}">
<div th:replace="~{fragments/admin-header :: adminHeader}"></div>

<main class="flex-grow-1 admin-crud-page">
    <div class="container">

        <div class="admin-crud-nav">
            <a th:href="@{/admin/coupons}" class="admin-crud-back">
                <i class="bi bi-arrow-left"></i>
                <span>Quay lại danh sách mã giảm giá</span>
            </a>
        </div>

        <section class="admin-crud-head">
            <div>
                <span>Quản lý mã giảm giá</span>
                <h1 th:text="${pageTitle}">Thêm mã giảm giá</h1>
                <p>Thiết lập loại giảm, điều kiện áp dụng và thời hạn.</p>
            </div>
        </section>

        <section class="admin-form-card">
            <form th:action="@{/admin/coupons/save}" method="post" class="admin-form">
                <input type="hidden" name="id" th:value="${coupon.id}">

                <div class="admin-form-grid">
                    <div class="admin-form-field">
                        <label for="code">Mã giảm giá <span>*</span></label>
                        <div class="admin-form-control-wrap">
                            <i class="bi bi-ticket"></i>
                            <input id="code"
                                   name="code"
                                   type="text"
                                   class="admin-form-control"
                                   placeholder="Ví dụ: WELCOME10"
                                   th:value="${coupon.code}"
                                   maxlength="32"
                                   required>
                        </div>
                        <p class="admin-form-help">Mã sẽ tự động chuyển thành chữ hoa.</p>
                    </div>

                    <div class="admin-form-field">
                        <label for="discountType">Loại giảm giá <span>*</span></label>
                        <div class="admin-form-control-wrap">
                            <i class="bi bi-tag"></i>
                            <select id="discountType" name="discountType" class="admin-form-control" required>
                                <option value="PERCENT" th:selected="${coupon.discountType == 'PERCENT'}">Giảm theo %</option>
                                <option value="FIXED" th:selected="${coupon.discountType == 'FIXED'}">Giảm cố định</option>
                            </select>
                        </div>
                    </div>

                    <div class="admin-form-field">
                        <label for="discountValue">Giá trị giảm <span>*</span></label>
                        <div class="admin-form-control-wrap">
                            <i class="bi bi-percent"></i>
                            <input id="discountValue"
                                   name="discountValue"
                                   type="number"
                                   min="0"
                                   step="0.1"
                                   class="admin-form-control"
                                   placeholder="Ví dụ: 10 hoặc 100000"
                                   th:value="${coupon.discountValue}"
                                   required>
                        </div>
                    </div>

                    <div class="admin-form-field">
                        <label for="maxDiscountAmount">Giảm tối đa (chỉ %)</label>
                        <div class="admin-form-control-wrap">
                            <i class="bi bi-cash"></i>
                            <input id="maxDiscountAmount"
                                   name="maxDiscountAmount"
                                   type="number"
                                   min="0"
                                   step="1000"
                                   class="admin-form-control"
                                   placeholder="Ví dụ: 200000"
                                   th:value="${coupon.maxDiscountAmount}">
                        </div>
                    </div>

                    <div class="admin-form-field">
                        <label for="minOrderAmount">Đơn tối thiểu</label>
                        <div class="admin-form-control-wrap">
                            <i class="bi bi-cash-coin"></i>
                            <input id="minOrderAmount"
                                   name="minOrderAmount"
                                   type="number"
                                   min="0"
                                   step="1000"
                                   class="admin-form-control"
                                   placeholder="Ví dụ: 500000"
                                   th:value="${coupon.minOrderAmount}">
                        </div>
                    </div>

                    <div class="admin-form-field">
                        <label for="minNights">Số đêm tối thiểu</label>
                        <div class="admin-form-control-wrap">
                            <i class="bi bi-moon-stars"></i>
                            <input id="minNights"
                                   name="minNights"
                                   type="number"
                                   min="1"
                                   class="admin-form-control"
                                   placeholder="Ví dụ: 2"
                                   th:value="${coupon.minNights}">
                        </div>
                    </div>

                    <div class="admin-form-field">
                        <label for="validFrom">Hiệu lực từ</label>
                        <div class="admin-form-control-wrap">
                            <i class="bi bi-calendar-event"></i>
                            <input id="validFrom"
                                   name="validFrom"
                                   type="datetime-local"
                                   class="admin-form-control"
                                   th:value="${coupon.validFrom != null ? #temporals.format(coupon.validFrom, 'yyyy-MM-dd''T''HH:mm') : ''}">
                        </div>
                    </div>

                    <div class="admin-form-field">
                        <label for="validUntil">Hiệu lực đến</label>
                        <div class="admin-form-control-wrap">
                            <i class="bi bi-calendar-check"></i>
                            <input id="validUntil"
                                   name="validUntil"
                                   type="datetime-local"
                                   class="admin-form-control"
                                   th:value="${coupon.validUntil != null ? #temporals.format(coupon.validUntil, 'yyyy-MM-dd''T''HH:mm') : ''}">
                        </div>
                    </div>
                </div>

                <div class="admin-form-field">
                    <label class="admin-form-toggle">
                        <input type="checkbox"
                               name="isActive"
                               value="true"
                               th:checked="${coupon.isActive}">
                        <span>Kích hoạt mã giảm giá</span>
                    </label>
                </div>

                <div class="admin-form-actions">
                    <a th:href="@{/admin/coupons}" class="admin-form-secondary">
                        Hủy
                    </a>

                    <button type="submit" class="admin-form-submit">
                        <i class="bi bi-check2"></i>
                        <span th:text="${submitText}">Lưu</span>
                    </button>
                </div>
            </form>
        </section>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/toast.js}"></script>
</body>
</html>
