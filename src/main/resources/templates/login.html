<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hotel Booking</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    

    <div th:replace="~{fragments/toast :: toastScripts}"></div>

</head>

<body class="d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<div id="toastLoginError" th:if="${param.error != null}" data-active="true"></div>
<div id="toastLogoutSuccess" th:if="${param.logout != null}" data-active="true"></div>
<div id="toastRegisterSuccess" th:if="${param.registered != null}" data-active="true"></div>

<main class="flex-grow-1 auth-page">
    <div class="container">
        <div class="auth-shell">

            <section class="auth-card">
                <div class="auth-head">
                    <a class="auth-brand" th:href="@{/}">
                        <span class="app-brand-mark">
                            <i class="bi bi-building"></i>
                        </span>
                        <span>Hotel Booking</span>
                    </a>

                    <h1>Đăng nhập</h1>
                    <p>
                        Tiếp tục đặt phòng và quản lý lịch sử lưu trú của bạn.
                    </p>
                </div>

                <form th:action="@{/login}" method="post" class="auth-form">
                    <div class="auth-field">
                        <label for="username">Tên đăng nhập</label>
                        <div class="auth-input-wrap">
                            <i class="bi bi-person"></i>
                            <input id="username"
                                   name="username"
                                   type="text"
                                   class="auth-control"
                                   placeholder="Nhập tên đăng nhập"
                                   autocomplete="username"
                                   required>
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="password">Mật khẩu</label>
                        <div class="auth-input-wrap">
                            <i class="bi bi-lock"></i>
                            <input id="password"
                                   name="password"
                                   type="password"
                                   class="auth-control"
                                   placeholder="Nhập mật khẩu"
                                   autocomplete="current-password"
                                   required>
                        </div>
                    </div>
                    <div class="auth-options">
                        <label class="auth-remember">
                            <input id="rememberMe"
                                name="remember-me"
                                type="checkbox">
                            <span>Ghi nhớ đăng nhập</span>
                        </label>
                    </div>

                    <button type="submit" class="auth-submit">
                        Đăng nhập
                    </button>
                </form>

                <div class="auth-switch">
                    <span>Chưa có tài khoản?</span>
                    <a th:href="@{/register}">Đăng ký ngay</a>
                </div>
            </section>

        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/toast.js}"></script>
</body>
</html>
